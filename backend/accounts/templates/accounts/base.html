{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0f4550" />
    <meta name="robots" content="noindex" />
    <title>{% block title %}Sign in{% endblock %} · Maat</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'accounts/favicon.svg' %}" />
    <link rel="stylesheet" href="{% static 'accounts/auth.css' %}" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="sky__glow"></div>
      <svg class="sky__icon sky__icon--gold sky__icon--float" style="left:6%;top:16%;width:64px;height:64px;--rot:-18deg;animation-delay:0s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.086 18.412A2 2 0 0112.67 19H5v-7.672a2 2 0 01.586-1.414L11.75 3.75a6 6 0 118.49 8.49z"/><path d="M16 8 2 22"/><path d="M17.488 15H9"/></svg>
      <svg class="sky__icon sky__icon--gold sky__icon--float-slow" style="left:86%;top:20%;width:72px;height:72px;--rot:8deg;animation-delay:1.5s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></svg>
      <svg class="sky__icon sky__icon--white sky__icon--drift" style="left:10%;top:68%;width:56px;height:56px;--rot:12deg;animation-delay:0.6s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></svg>
      <svg class="sky__icon sky__icon--gold sky__icon--float" style="left:82%;top:70%;width:60px;height:60px;--rot:-8deg;animation-delay:2.2s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      <svg class="sky__icon sky__icon--white sky__icon--drift" style="left:28%;top:10%;width:44px;height:44px;--rot:-25deg;animation-delay:3s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <svg class="sky__icon sky__icon--white sky__icon--float-slow" style="left:68%;top:8%;width:48px;height:48px;--rot:15deg;animation-delay:0.9s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      <svg class="sky__icon sky__icon--gold sky__icon--float" style="left:48%;top:88%;width:40px;height:40px;--rot:0deg;animation-delay:1.1s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/></svg>
      <svg class="sky__icon sky__icon--white sky__icon--drift" style="left:93%;top:46%;width:44px;height:44px;--rot:-6deg;animation-delay:2.6s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
    </div>

    <header class="top">
      <a class="brand" href="{{ FRONTEND_URL }}" aria-label="Maat, back to the site">
        <span class="brand__mark"><svg class="brand__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="2.25"><path d="M14.086 18.412A2 2 0 0112.67 19H5v-7.672a2 2 0 01.586-1.414L11.75 3.75a6 6 0 118.49 8.49z"/><path d="M16 8 2 22"/><path d="M17.488 15H9"/></svg></span>
        <span class="brand__name">Maat</span>
      </a>
      <a class="top__link" href="{{ FRONTEND_URL }}"><svg class="top__link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span>Back to the site</span></a>
    </header>

    <main class="stage">
      {% block content %}{% endblock %}
    </main>

    <footer class="foot">© {% now "Y" %} Maat · Weighing rumours against the record.</footer>
  </body>
</html>
