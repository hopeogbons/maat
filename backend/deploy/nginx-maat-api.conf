# nginx site for the maat API. Replace api.yourdomain.com with your real host.
#
# Install:
#   sudo cp /srv/maat/backend/deploy/nginx-maat-api.conf /etc/nginx/sites-available/maat-api
#   sudo ln -s /etc/nginx/sites-available/maat-api /etc/nginx/sites-enabled/maat-api
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (adds the 443 block and the http->https redirect for you):
#   sudo certbot --nginx -d api.yourdomain.com

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    client_max_body_size 20m;

    # Collected static files (admin CSS/JS). WhiteNoise also serves these,
    # but nginx is faster and this keeps gunicorn workers free.
    location /static/ {
        alias /srv/maat/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Django relies on these for ALLOWED_HOSTS and SECURE_PROXY_SSL_HEADER.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }
}
